<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a1f">
  <meta name="color-scheme" content="dark">
  <title>Spooky Bingo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
  <link rel="stylesheet" href="style.css">
  <script defer src="items.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="bats" aria-hidden="true">
      <span class="bat">🦇</span>
      <span class="bat">🦇</span>
      <span class="bat">🦇</span>
    </div>
    <h1>Spooky Bingo <span class="title-emoji">👻</span></h1>
    <p class="subtitle">Breckenridge Halloween 2026</p>
  </header>

  <main>
    <div id="board" class="board" role="group" aria-label="Bingo card"></div>
    <div class="status-row">
      <p id="status" class="status" role="status"></p>
      <button id="info" class="info-button" type="button" aria-label="About this game"><span aria-hidden="true">i</span></button>
    </div>
  </main>

  <nav class="actions" aria-label="Card actions">
    <button id="new-card" class="action" type="button">New Card</button>
    <button id="reset-stamps" class="action" type="button">Reset Stamps</button>
    <button id="save-image" class="action action--primary" type="button">Save Image</button>
  </nav>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-buttons">
        <button class="action" value="cancel">Cancel</button>
        <button id="confirm-ok" class="action action--primary" value="ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="win" class="win">
    <form method="dialog" class="win-content">
      <p id="win-title" class="win-title"></p>
      <p id="win-detail" class="win-detail"></p>
      <button class="action action--primary win-dismiss">Dismiss</button>
    </form>
  </dialog>

  <dialog id="about" class="confirm about">
    <form method="dialog">
      <h2 class="about-title">Spooky Bingo 👻</h2>
      <p>This is just for fun, so there are no actual prizes.</p>
      <p>Have fun, get home safe, and have a happy spooky Halloween!</p>
      <p class="about-credit">
        Built by Ethan Arrowood<br>
        <a href="https://www.instagram.com/ethan_arrowood/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://ethanarrowood.com" target="_blank" rel="noopener">Website</a>
      </p>
      <button class="action action--primary about-close" autofocus>Close</button>
    </form>
  </dialog>
</body>
</html>
